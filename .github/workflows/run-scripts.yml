name: Test My Scripts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make all scripts executable
        run: find scripts -name "*.sh" -exec chmod +x {} \;

      - name: Create dummy directories for testing
        run: |
          mkdir -p /tmp/test-source
          mkdir -p /tmp/test-backup
          echo "hello world" > /tmp/test-source/hello.txt

      - name: Run the backup script
        run: ./scripts/backup/backup-dir.sh /tmp/test-source /tmp/test-backup

      - name: Verify backup was created
        run: |
          echo "--- محتویات پوشه بکاپ ---"
          ls -la /tmp/test-backup/
