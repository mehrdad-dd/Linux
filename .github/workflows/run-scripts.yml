name: Test My Scripts

on:
  push:
    branches: [ main ]
  workflow_dispatch: # this allows to run manually

jobs:
  run-script:
    runs-on: ubuntu-latest # github creates a temp Linux srv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/backup/backup-dir.sh

      - name: Run the backup script
        run: ./scripts/backup/backup-dir.sh /tmp/test
